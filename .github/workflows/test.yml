name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Weekly performance run (Monday 02:00 UTC)
    - cron: "0 2 * * 1"

jobs:
  lint:
    name: Lint (black, flake8, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev,sqlite,otel,mysql]"

      - name: Formatting (black)
        run: black --check conductor/ tests/ scripts/ examples/

      - name: Lint (flake8)
        run: flake8 conductor/ tests/ scripts/ examples/

      - name: Type check (mypy --strict)
        run: mypy conductor/

      - name: Validate deployment artifacts
        run: python scripts/validate_deploy.py

  frontend:
    name: Frontend (npm ci && npm run build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: conductor/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: conductor/web

      - name: Build frontend
        run: npm run build
        working-directory: conductor/web

      - name: Verify committed dist is fresh
        run: git diff --exit-code -- conductor/web/dist

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: conductor
          POSTGRES_DB: conductor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conductor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgresql://conductor:conductor@localhost:5432/conductor_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev,sqlite,otel,mysql]"

      - name: Run tests (unit, integration, e2e)
        run: pytest tests/unit tests/integration tests/e2e -m "not perf" --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sqlite:
    name: SQLite backend (no services)
    runs-on: ubuntu-latest
    # Proves the embedded backend works with no database server at all: the
    # parity matrix runs the same flows as the PostgreSQL job above.
    env:
      CONDUCTOR_TEST_DATABASE_URLS: sqlite:////tmp/conductor_test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev, sqlite and mysql extras
        run: pip install -e ".[dev,sqlite,mysql]"

      - name: Run unit tests and the backend parity matrix (SQLite)
        run: pytest tests/unit tests/integration/test_backend_matrix.py --no-cov

  mysql:
    name: MySQL backend (${{ matrix.server }})
    runs-on: ubuntu-latest
    # Proves the MySQL/MariaDB backend against a real server: the minimum
    # supported MySQL (8.0, where named CHECK constraints landed in 8.0.16),
    # the current 8.4 LTS, and MariaDB (10.6 is the minimum because
    # ``FOR UPDATE SKIP LOCKED`` arrived there — MariaDB 10.5 is rejected at
    # connect() by validate_server_version).
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: MySQL 8.0
            image: mysql:8.0
            health-cmd: mysqladmin ping -h 127.0.0.1 -uconductor -pconductor
          - server: MySQL 8.4
            image: mysql:8.4
            health-cmd: mysqladmin ping -h 127.0.0.1 -uconductor -pconductor
          - server: MariaDB 11
            image: mariadb:11
            # The MariaDB image ships mariadb-admin, not mysqladmin.
            health-cmd: mariadb-admin ping -h 127.0.0.1 -uconductor -pconductor
    services:
      mysql:
        image: ${{ matrix.image }}
        # Both images accept the MYSQL_* variable names.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: conductor_test
          MYSQL_USER: conductor
          MYSQL_PASSWORD: conductor
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health-cmd }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CONDUCTOR_TEST_DATABASE_URLS: mysql://conductor:conductor@127.0.0.1:3306/conductor_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev, sqlite and mysql extras
        run: pip install -e ".[dev,sqlite,mysql]"

      - name: Run unit tests and the backend parity matrix (${{ matrix.server }})
        run: pytest tests/unit tests/integration/test_backend_matrix.py --no-cov

  perf:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Manual or scheduled runs only; thresholds are relaxed for CI machines.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: conductor
          POSTGRES_DB: conductor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conductor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUCTOR_TEST_DATABASE_URL: postgresql://conductor:conductor@localhost:5432/conductor_test
      # Relaxed thresholds for shared CI runners (see tests/perf/test_benchmarks.py)
      PERF_MAX_SUBMIT_MS: "5"
      PERF_MAX_EXEC_MS: "20"
      PERF_MAX_POLL_MS: "500"
      PERF_MIN_THROUGHPUT: "200"
      PERF_MAX_MEMORY_MB: "80"
      PERF_SAMPLES_SUBMIT: "200"
      PERF_SAMPLES_EXEC: "50"
      PERF_SAMPLES_POLL: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run benchmarks
        run: pytest tests/perf -m perf --no-cov -v

  docker:
    name: Docker Compose example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Validate compose config
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml config --quiet

      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml up -d --build

      - name: Wait for worker to become healthy
        run: |
          for i in $(seq 1 24); do
            status=$(docker inspect -f '{{.State.Health.Status}}' conductor-worker 2>/dev/null || echo starting)
            echo "attempt $i: worker status=$status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml ps
          docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml logs worker
          exit 1

      - name: Show stack status
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml ps

      - name: Verify health endpoint
        run: curl -sf http://localhost:8000/health

      - name: Verify metrics endpoint
        run: curl -sf http://localhost:8000/metrics | grep -E '^conductor_' | head -5

      - name: Verify a task executes through the compose worker
        run: python tests/docker/verify_task.py

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f tests/docker/compose.ci.yml down -v
